name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'Edgescrum/peco-design-system'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # NPM_TOKEN 未設定（npm org 作成前）の間は publish をスキップして
      # changeset の Version PR 運用だけ回す
      - name: check npm token
        id: npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN 未設定のため publish はスキップ（Version PR の作成のみ）"
          fi
      - name: create release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm version` は pnpm の組み込みコマンド（semver バンプ）に食われるため
          # `pnpm run` で package.json のスクリプトを明示的に呼ぶ
          version: pnpm run version-packages
          publish: ${{ steps.npm.outputs.present == 'true' && 'pnpm run release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
