name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    # ★ リポジトリ名ではなく **owner** で判定する（2026-10-06）。
    #   以前は `github.repository == 'Edgescrum/peco-design-system'` だった。
    #   これは job レベルの if なので、**false になるとジョブが skip され
    #   ワークフローは success を返す** — publish も同期も緑のまま静かに止まる。
    #   リポジトリ改名（§9-3: design-system）でそれを踏むところだった。
    #   owner 判定ならフォークは従来どおり弾き、改名では壊れない。
    if: github.repository_owner == 'Edgescrum'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # NPM_TOKEN 未設定（npm org 作成前）の間は publish をスキップして
      # changeset の Version PR 運用だけ回す
      - name: check npm token
        id: npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN 未設定のため publish はスキップ（Version PR の作成のみ）"
          fi
      - name: create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm version` は pnpm の組み込みコマンド（semver バンプ）に食われるため
          # `pnpm run` で package.json のスクリプトを明示的に呼ぶ
          version: pnpm run version-packages
          publish: ${{ steps.npm.outputs.present == 'true' && 'pnpm run release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node (registry-url 指定) が生成する .npmrc は NODE_AUTH_TOKEN を参照する。
          # これが無いと publish が無認証になり、scoped パッケージは 404 で落ちる（実測）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 旧名（ADR 0026 で改名）に npm の deprecate フラグを立てる。
      # package.json に書けるフィールドではなくレジストリ側の操作なので、publish 後に毎回打つ。
      # 冪等なので同じ内容で何度実行してもよい。
      # ★ 失敗しても release は落とさない（publish は既に済んでいる）。ただし警告は残す。
      #
      # ★★ 条件は `steps.changesets.outputs.published` ではなく **NPM_TOKEN の有無**。
      #   published 判定だと「publish が起きた run でしか直せない」ため、取りこぼしが
      #   次の release まで残る。実際に 1 回取りこぼした（下記）。冪等なので毎回打てばよい。
      #
      # ★★★ publish 直後は packument に新バージョンがまだ載っていない。
      #   `npm deprecate <pkg>`（範囲なし）は**その時点で見えているバージョンだけ**に
      #   フラグを立てるので、publish の 5 秒後に打った結果
      #   **peco-ui@1.0.0（たったいま publish した shim 自身）が deprecate されなかった**
      #   —— 0.1.0〜0.4.0 にはついた。ログに `deprecating ...@1.0.0` が無いことで判る。
      #   そこで反映を待ってから打つ。省略版 packument（npm install が使う形式）を
      #   見るのは、full packument 側が publish 前の 404 を CDN に負キャッシュされていて
      #   数分間 404 を返し続けるため（これも実測）。
      - name: deprecate old package names
        if: steps.npm.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          wait_for() {  # $1 = pkg, $2 = 待つバージョン
            for _ in $(seq 1 30); do
              if curl -fsS -H 'Accept: application/vnd.npm.install-v1+json' \
                   "https://registry.npmjs.org/$(printf '%s' "$1" | sed 's|/|%2f|')" \
                 | grep -q "\"$2\""; then return 0; fi
              sleep 4
            done
            echo "::warning::$1@$2 が packument に出てこなかった（deprecate は取りこぼす可能性あり）"
          }
          wait_for "@edgescrum/peco-ui" "$(node -p "require('./packages/shim-peco-ui/package.json').version")"

          npm deprecate "@edgescrum/peco-tokens" \
            "Renamed to @edgescrum/ds-foundation (ADR 0026). No shim is published for this name." \
            || echo "::warning::npm deprecate @edgescrum/peco-tokens に失敗した（publish 自体は成功）"
          npm deprecate "@edgescrum/peco-ui" \
            "Renamed to @edgescrum/ds-core (ADR 0026). 1.x is a re-export shim for migration only; set Tailwind @source to @edgescrum/ds-core." \
            || echo "::warning::npm deprecate @edgescrum/peco-ui に失敗した（publish 自体は成功）"

          echo "### deprecate 後の状態" >> "$GITHUB_STEP_SUMMARY"
          for p in @edgescrum/peco-tokens @edgescrum/peco-ui; do
            curl -fsS "https://registry.npmjs.org/$(printf '%s' "$p" | sed 's|/|%2f|')" \
              | node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const d=JSON.parse(s);
                  const rows=Object.entries(d.versions).map(([v,m])=>`${v}:${m.deprecated?"deprecated":"★未設定"}`);
                  console.log(`- **${d.name}** — ${rows.join(" / ")}`);
                })' >> "$GITHUB_STEP_SUMMARY" || true
          done
