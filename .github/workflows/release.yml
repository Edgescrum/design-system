name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    # ★ リポジトリ名ではなく **owner** で判定する（2026-10-06）。
    #   以前は `github.repository == 'Edgescrum/peco-design-system'` だった。
    #   これは job レベルの if なので、**false になるとジョブが skip され
    #   ワークフローは success を返す** — publish も同期も緑のまま静かに止まる。
    #   リポジトリ改名（§9-3: design-system）でそれを踏むところだった。
    #   owner 判定ならフォークは従来どおり弾き、改名では壊れない。
    if: github.repository_owner == 'Edgescrum'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # NPM_TOKEN 未設定（npm org 作成前）の間は publish をスキップして
      # changeset の Version PR 運用だけ回す
      - name: check npm token
        id: npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN 未設定のため publish はスキップ（Version PR の作成のみ）"
          fi
      - name: create release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm version` は pnpm の組み込みコマンド（semver バンプ）に食われるため
          # `pnpm run` で package.json のスクリプトを明示的に呼ぶ
          version: pnpm run version-packages
          publish: ${{ steps.npm.outputs.present == 'true' && 'pnpm run release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node (registry-url 指定) が生成する .npmrc は NODE_AUTH_TOKEN を参照する。
          # これが無いと publish が無認証になり、scoped パッケージは 404 で落ちる（実測）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
