name: Code Connect Publish

# code-connect/**.figma.ts が main に入ったら Figma へ公開する
# （Figma の部品を選ぶと Dev Mode に実コードが出るようにする）。
#
# 必要な権限: FIGMA_TOKEN（secret）に **file_code_connect:write** スコープが要る。
# Variables 同期用のスコープ（file_variables:*）とは別なので、
# 403 が返ったらトークンを作り直してスコープを足すこと。

on:
  push:
    branches: [main]
    paths:
      - "code-connect/**"
      - "figma.config.json"
  workflow_dispatch:

jobs:
  publish:
    # ★ リポジトリ名ではなく **owner** で判定する（2026-10-06）。
    #   以前は `github.repository == 'Edgescrum/peco-design-system'` だった。
    #   これは job レベルの if なので、**false になるとジョブが skip され
    #   ワークフローは success を返す** — publish も同期も緑のまま静かに止まる。
    #   リポジトリ改名（§9-3: design-system）でそれを踏むところだった。
    #   owner 判定ならフォークは従来どおり弾き、改名では壊れない。
    if: github.repository_owner == 'Edgescrum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # CLI のサブコマンドは `figma connect publish`（`figma publish` ではない）
      - name: publish Code Connect templates
        run: npx --yes @figma/code-connect@latest connect publish
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_TOKEN }}
