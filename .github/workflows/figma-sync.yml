name: Figma Variables Sync

# トークン JSON が main に入ったら Figma Variables を自動更新する（コードが正 → Figma は写し）。
# FIGMA_TOKEN（secret）と FIGMA_FILE_KEY（variable）の設定が必要。
# ライブラリファイル未作成の間は未設定のままでよい（スクリプトが CI では exit 0 でスキップする）。

on:
  push:
    branches: [main]
    paths:
      - "packages/tokens/tokens/**"
  workflow_dispatch:

jobs:
  sync:
    # ★ リポジトリ名ではなく **owner** で判定する（2026-10-06）。
    #   以前は `github.repository == 'Edgescrum/peco-design-system'` だった。
    #   これは job レベルの if なので、**false になるとジョブが skip され
    #   ワークフローは success を返す** — publish も同期も緑のまま静かに止まる。
    #   リポジトリ改名（§9-3: design-system）でそれを踏むところだった。
    #   owner 判定ならフォークは従来どおり弾き、改名では壊れない。
    if: github.repository_owner == 'Edgescrum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: sync tokens to Figma Variables
        run: node packages/tokens/scripts/sync-figma.mjs
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY }}
